name: Check links

on:
  schedule:
    # Every Monday at 07:00 Europe/London (follows BST/GMT).
    - cron: "0 7 * * 1"
      timezone: "Europe/London"
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: read
  issues: write

jobs:
  check-links:
    name: Check links and update report issue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Test link checker
        run: ruby script/test_check_links.rb

      - name: Run link checker
        id: check
        run: |
          set -o pipefail
          ruby script/check_links.rb --json | tee linkcheck.out
          # Surface the counts to later steps.
          line=$(grep '^LINKCHECK_RESULT' linkcheck.out || echo "LINKCHECK_RESULT dead=0 suspect=0 checked=0")
          echo "$line" | sed 's/LINKCHECK_RESULT //; s/ /\n/g' >> "$GITHUB_OUTPUT"

      - name: Upload report artifact
        uses: actions/upload-artifact@v7
        with:
          name: dead-links-report
          path: |
            reports/dead_links.md
            reports/dead_links.json
          if-no-files-found: warn

      - name: Update tracking issue
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('reports/dead_links.md', 'utf8');
            const dead = ${{ steps.check.outputs.dead || 0 }};
            const suspect = ${{ steps.check.outputs.suspect || 0 }};

            const MARKER = '<!-- linkcheck-tracking-issue -->';
            const title = '🔗 Dead / stale links';
            const label = 'link-report';
            const assignee = 'chizmeeple';

            // Remove everyone first, then assign. GitHub only notifies when
            // someone is newly assigned, so a re-assign has to be two calls.
            async function reassign(issueNumber, currentAssignees) {
              const logins = (currentAssignees || []).map(user => user.login);
              if (logins.length > 0) {
                await github.rest.issues.removeAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  assignees: logins,
                });
              }
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                assignees: [assignee],
              });
            }

            // GitHub issue bodies cap at 65536 chars; trim defensively.
            let body = MARKER + '\n\n' + report;
            if (body.length > 65000) {
              body = body.slice(0, 64000) +
                '\n\n_…report truncated. Download the full `dead-links-report` artifact from the workflow run._';
            }

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'b60205',
                description: 'Automated dead-link report',
              });
            }

            // Find our existing tracking issue (by marker in body).
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });
            const issue = existing.find(i => (i.body || '').includes(MARKER));

            if (dead === 0 && suspect === 0) {
              // Nothing wrong. Close the issue if it exists, otherwise do nothing.
              if (issue) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number,
                  body: 'All checked links responded OK on the latest run. Closing this. A new issue will be opened if links break again.',
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, state: 'closed',
                });
              }
              return;
            }

            if (issue) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, title, body, state: 'open',
              });
              await reassign(issue.number, issue.assignees);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: [label], assignees: [assignee],
              });
            }
