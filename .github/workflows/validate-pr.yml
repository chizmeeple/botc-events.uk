name: Validate PR

on:
  pull_request:
    branches: [main]

jobs:
  validate-clubs:
    name: Validate club data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Validate club frontmatter
        run: ruby script/validate_clubs.rb

  build:
    name: Jekyll build & JSON check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Generate events data
        run: bundle exec ruby script/generate_events.rb

      - name: Generate special events data
        run: bundle exec ruby script/generate_special_events.rb

      - name: Generate calendar ICS feed
        run: bundle exec ruby script/generate_calendar_ics.rb

      - name: Validate rendered_events.json
        run: ruby script/validate_events.rb

      - name: Validate rendered_special_events.json
        run: ruby script/validate_special_events.rb

      - name: Build site
        run: bundle exec jekyll build

      - name: Validate clubs.json
        run: ruby script/validate_clubs_json.rb

  summarise-group-pages:
    name: Summarise group page changes
    runs-on: ubuntu-latest
    # This job checks out the pull request. Keep the token read-only.
    # comment-group-pages.yml posts the comment from the base repository.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Test changed group pages script
        run: ruby script/test_changed_group_pages.rb

      - name: Test group page comment script
        run: ruby script/test_comment_group_pages.rb

      - name: List changed group pages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: ruby script/changed_group_pages.rb "$BASE_SHA" "$HEAD_SHA" | tee group-pages.md

      - name: Write job summary
        run: cat group-pages.md >> "$GITHUB_STEP_SUMMARY"

      - name: Record pull request number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p group-pages-artifact
          mv group-pages.md group-pages-artifact/group-pages.md
          ruby -rjson -e 'pr = Integer(ENV.fetch("PR_NUMBER"), 10); abort("invalid pull request number") unless pr.positive?; File.write("group-pages-artifact/group-pages-meta.json", JSON.generate({"pr_number" => pr}) + "\n")'

      - name: Upload group pages summary
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: group-pages
          path: group-pages-artifact/
          if-no-files-found: error
          retention-days: 5
          overwrite: true
